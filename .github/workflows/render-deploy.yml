name: Deploy to Render

# Auto-deploy chain: push to main -> this workflow -> Render API deploy trigger.
# The repo is connected to Render by public URL (no GitHub App webhook), so
# GitHub Actions bridges the gap. RENDER_API_KEY is stored as an encrypted
# repo secret; only Actions can read it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          set -e
          echo "Triggering deploy for zerox-bypass-panel (srv-dbq5q2ff3r2c738u2tjg)..."
          # 3 attempts with backoff; each curl is time-boxed so a hanging API
          # can never stall this job for hours.
          for i in 1 2 3; do
            if resp=$(curl -sS --max-time 90 -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services/srv-dbq5q2ff3r2c738u2tjg/deploys \
              -d '{}'); then
              echo "$resp" | head -c 300; echo
              if echo "$resp" | grep -q '"id"'; then
                echo "Render deploy triggered successfully (attempt $i)."
                exit 0
              fi
            else
              echo "curl failed (attempt $i), retrying in 20s..."
            fi
            [ "$i" = "3" ] || sleep 20
          done
          echo "::error::Render deploy trigger failed after 3 attempts"
          exit 1
