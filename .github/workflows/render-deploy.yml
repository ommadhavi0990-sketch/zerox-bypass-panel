name: Deploy to Render

# Auto-deploy chain: push to main -> this workflow -> Render API deploy trigger.
# The repo is connected to Render by public URL (no GitHub App webhook), so
# GitHub Actions bridges the gap. RENDER_API_KEY is stored as an encrypted
# repo secret; only Actions can read it.
#
# Triggers:
#   push             - deploy immediately after every push to main
#   schedule         - reconcile loop: if Render is behind GitHub (e.g. the API
#                      hung during a push trigger), the next run catches up
#   workflow_dispatch - manual "Run workflow" button in the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

env:
  SERVICE_ID: srv-dbq5q2ff3r2c738u2tjg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Render deploy with GitHub HEAD
        run: |
          set -e

          api() { # api METHOD PATH [DATA]
            curl -sS --max-time 90 -X "$1" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1$2" ${3:+-d "$3"}
          }

          retry() { # retry LABEL CMD...
            local label="$1"; shift
            for i in 1 2 3; do
              if out=$("$@"); then echo "$out"; return 0; fi
              echo "$label: attempt $i failed, retrying in 20s..." >&2
              [ "$i" = "3" ] || sleep 20
            done
            echo "::error::$label failed after 3 attempts"; return 1
          }

          # 1. GitHub HEAD of main
          HEAD=$(curl -sS --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "GitHub main HEAD: $HEAD"

          # 2. Render's latest live deploy commit (empty when never deployed)
          LIVE=$(retry "Render status" api GET "/services/$SERVICE_ID/deploys?limit=5" \
            | python3 -c '
              import json,sys
              deps = [d["deploy"] for d in json.load(sys.stdin)]
              live = [d for d in deps if d.get("status") == "live"]
              print(live[0]["commit"]["id"] if live and live[0].get("commit") else "")' || echo "")
          echo "Render live commit: ${LIVE:-<none>}"

          # 3. Nothing to do when Render already runs GitHub HEAD
          if [ "$LIVE" = "$HEAD" ]; then
            echo "Render is already up to date — no deploy needed."
            exit 0
          fi

          # 4. Trigger the deploy (Render builds the branch HEAD on its own)
          echo "Render is behind — triggering deploy..."
          RESP=$(retry "Render deploy trigger" api POST "/services/$SERVICE_ID/deploys" "{}")
          echo "$RESP" | head -c 300; echo
          echo "$RESP" | grep -q '"id"' || { echo "::error::Unexpected Render response"; exit 1; }
          echo "Render deploy triggered successfully."
